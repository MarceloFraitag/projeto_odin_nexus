<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Odin - Registo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <!-- Barra lateral com imagem de fundo e logótipo -->
        <div class="sidebar">
            <div class="logo-box">
                <img src="odin-lined.png" alt="Logótipo Odin">
                <span>ODIN</span>
            </div>
            <div class="photo-credit">
                Photo by <a href="https://unsplash.com/pt-br/fotografias/planta-da-folha-verde-na-fotografia-de-perto-25xggax4bSA" target="_blank">Halie West</a> on <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </div>
        </div>

        <!-- Painel do formulário -->
        <div class="form-container">
            <div class="form-header">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p class="call-to-action">You know you want to.</p>
            </div>

            <form action="#" method="post" class="signup-form">
                <div class="form-card">
                    <h2>Let's do this!</h2>

                    <div class="form-grid">
                        <div class="input-group">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>

                        <div class="input-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>

                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="input-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone">
                        </div>

                        <div class="input-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required minlength="8">
                        </div>

                        <div class="input-group">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
                        </div>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="submit-btn">Create Account</button>
                    <p class="login-link">Already have an account? <a href="#">Log in</a></p>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
